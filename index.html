<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Календарь: месяцы, недели и дни, события с повторами, поиск и тёмная тема. Работает офлайн, данные хранятся в браузере.">
<meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Календарь">
<title>Календарь</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b8cff'/%3E%3Crect x='13' y='17' width='38' height='34' rx='6' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M13 27h38M23 11v10M41 11v10' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
            <path d="M3 10h18M8 3v4M16 3v4"></path>
            <circle cx="8.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <h1>Календарь</h1>
      </div>

      <div class="nav">
        <button class="icon-btn" id="prevBtn" title="Предыдущий период (←)" aria-label="Предыдущий период">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <button class="btn ghost" id="todayBtn" title="Сегодня (T)">Сегодня</button>
        <button class="icon-btn" id="nextBtn" title="Следующий период (→)" aria-label="Следующий период">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>

      <div class="period" id="periodLabel" aria-live="polite"></div>

      <div class="spacer"></div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="searchInput" type="search" placeholder="Поиск событий…  (/)" autocomplete="off" aria-label="Поиск событий">
      </div>

      <div class="view-switch" role="tablist" aria-label="Вид календаря">
        <button role="tab" data-view="month" aria-selected="true" title="Месяц (M)">Месяц</button>
        <button role="tab" data-view="week" aria-selected="false" title="Неделя (W)">Неделя</button>
        <button role="tab" data-view="day" aria-selected="false" title="День (D)">День</button>
      </div>

      <button class="icon-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"></path></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg>
      </button>

      <button class="btn primary" id="newBtn" title="Новое событие (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <span>Событие</span>
      </button>
    </div>

    <div class="filters">
      <div class="color-filter" id="colorFilters" role="group" aria-label="Фильтр по цветам"></div>
      <div class="filter-info" id="filterInfo"></div>
      <button class="link-btn" id="resetFilters" hidden>Сбросить фильтры</button>
    </div>
  </header>

  <main class="view" id="view"></main>

  <footer class="statusbar">
    <span class="status-hint"><kbd>N</kbd> новое событие</span>
    <span class="status-hint"><kbd>T</kbd> сегодня</span>
    <span class="status-hint"><kbd>M</kbd> <kbd>W</kbd> <kbd>D</kbd> вид</span>
    <span class="status-hint"><kbd>←</kbd> <kbd>→</kbd> навигация</span>
    <span class="status-spacer"></span>
    <span class="status-hint" id="statusCount"></span>
  </footer>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form id="eventForm" novalidate>
      <div class="modal-head">
        <h2 id="modalTitle">Новое событие</h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <div class="modal-body">
        <label class="field span-2">
          <span>Название</span>
          <input id="fTitle" type="text" maxlength="120" placeholder="Например, встреча с клиентом" autocomplete="off">
        </label>

        <label class="field">
          <span>Дата</span>
          <input id="fDate" type="date">
        </label>

        <label class="field check">
          <input id="fAllDay" type="checkbox">
          <span>Весь день</span>
        </label>

        <label class="field" id="startField">
          <span>Начало</span>
          <input id="fStart" type="time" step="300">
        </label>

        <label class="field" id="endField">
          <span>Конец</span>
          <input id="fEnd" type="time" step="300">
        </label>

        <div class="field span-2">
          <span>Цвет</span>
          <div class="swatches" id="fColors" role="radiogroup" aria-label="Цвет события"></div>
        </div>

        <label class="field">
          <span>Повтор</span>
          <select id="fRepeat">
            <option value="none">Не повторяется</option>
            <option value="daily">Каждый день</option>
            <option value="weekly">Каждую неделю</option>
            <option value="monthly">Каждый месяц</option>
            <option value="yearly">Каждый год</option>
          </select>
        </label>

        <label class="field" id="untilField" hidden>
          <span>Повторять до</span>
          <input id="fUntil" type="date">
        </label>

        <label class="field span-2">
          <span>Заметка</span>
          <textarea id="fNotes" rows="3" maxlength="1000" placeholder="Детали, ссылка, адрес…"></textarea>
        </label>

        <p class="form-error span-2" id="formError" hidden></p>
        <p class="hint span-2" id="seriesHint" hidden>Это событие повторяется — изменения применятся ко всей серии.</p>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn danger-ghost" id="deleteBtn" hidden>Удалить</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="cancelBtn">Отмена</button>
        <button type="submit" class="btn primary" id="saveBtn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
